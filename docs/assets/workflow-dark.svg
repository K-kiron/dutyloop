<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="268" viewBox="0 0 1200 268" role="img" aria-labelledby="title desc">
<title id="title">The DutyLoop development loop</title>
<desc id="desc">Discover, implement, verify, review, and commit accepted work. Then discover again. Rejected work remains available for inspection.</desc>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"><rect x="1" y="1" width="1198" height="266" rx="18" fill="#101F25" stroke="#30484D"/>
<rect x="30" y="32" width="200" height="139" rx="12" fill="#182D33" stroke="#30484D"/>
<text x="47" y="61" fill="#80D7B3" font-size="13" font-weight="700" letter-spacing="1.5">01</text>
<text x="47" y="99" fill="#E7F2EC" font-size="25" font-weight="650">Discover</text>
<text x="47" y="132" fill="#A2BAB0" font-size="12.6">Evidence and task selection</text>
<path d="M237 101 h20 m-6 -6 6 6 -6 6" fill="none" stroke="#80D7B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="265" y="32" width="200" height="139" rx="12" fill="#182D33" stroke="#30484D"/>
<text x="282" y="61" fill="#80D7B3" font-size="13" font-weight="700" letter-spacing="1.5">02</text>
<text x="282" y="99" fill="#E7F2EC" font-size="25" font-weight="650">Implement</text>
<text x="282" y="132" fill="#A2BAB0" font-size="12.6">A managed Git worktree</text>
<path d="M472 101 h20 m-6 -6 6 6 -6 6" fill="none" stroke="#80D7B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="500" y="32" width="200" height="139" rx="12" fill="#182D33" stroke="#30484D"/>
<text x="517" y="61" fill="#80D7B3" font-size="13" font-weight="700" letter-spacing="1.5">03</text>
<text x="517" y="99" fill="#E7F2EC" font-size="25" font-weight="650">Verify</text>
<text x="517" y="132" fill="#A2BAB0" font-size="12.6">Your acceptance commands</text>
<path d="M707 101 h20 m-6 -6 6 6 -6 6" fill="none" stroke="#80D7B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="735" y="32" width="200" height="139" rx="12" fill="#182D33" stroke="#30484D"/>
<text x="752" y="61" fill="#80D7B3" font-size="13" font-weight="700" letter-spacing="1.5">04</text>
<text x="752" y="99" fill="#E7F2EC" font-size="25" font-weight="650">Review</text>
<text x="752" y="132" fill="#A2BAB0" font-size="12.6">A separate agent invocation</text>
<path d="M942 101 h20 m-6 -6 6 6 -6 6" fill="none" stroke="#80D7B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="970" y="32" width="200" height="139" rx="12" fill="#182D33" stroke="#30484D"/>
<text x="987" y="61" fill="#80D7B3" font-size="13" font-weight="700" letter-spacing="1.5">05</text>
<text x="987" y="99" fill="#E7F2EC" font-size="25" font-weight="650">Commit</text>
<text x="987" y="132" fill="#A2BAB0" font-size="12.6">An inspectable local branch</text>

<path d="M1070 182 V214 Q1070 224 1060 224 H140 Q130 224 130 214 V185 m-6 6 6 -6 6 6" fill="none" stroke="#80D7B3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="420" y="207" width="360" height="34" rx="17" fill="#101F25"/>
<text x="600" y="229" text-anchor="middle" fill="#A2BAB0" font-size="16" font-weight="550">Accepted work leads to new discovery</text>
</g>
</svg>
