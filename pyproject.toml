[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dutyloop"
version = "0.2.0"
description = "A local, persistent repository super-agent with explicit budgets and human control"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Wenhao XU"}]
dependencies = []
keywords = ["agents", "automation", "developer-tools", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
mcp = ["mcp>=1.20,<2"]
dev = ["pytest>=8", "build>=1", "ruff>=0.9"]

[project.scripts]
dutyloop = "dutyloop.cli:main"

[project.urls]
Homepage = "https://github.com/K-kiron/dutyloop"
Issues = "https://github.com/K-kiron/dutyloop/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
